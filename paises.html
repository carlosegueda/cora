<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CORA · Países</title>
    <link rel="stylesheet" href="/src/paises.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Países y territorios</h1>
        <p id="summary"></p>
        <input id="search" type="search" placeholder="Buscar por nombre, código o continente…" autocomplete="off" />
      </header>
      <table>
        <thead>
          <tr>
            <th>Bandera</th>
            <th>Español</th>
            <th>English</th>
            <th>Português</th>
            <th>ISO</th>
            <th>Tipo</th>
            <th>Continente</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="source">
        Datos: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> (dominio público) ·
        Banderas: <a href="https://github.com/lipis/flag-icons" target="_blank" rel="noopener">flag-icons</a> (MIT)
      </p>
    </main>
    <script type="module" src="/src/paises.js"></script>
  </body>
</html>
